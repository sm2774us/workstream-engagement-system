[package]
name = "wes-risk-engine"
version = "1.0.0"
edition = "2021"
description = "Performance-critical Workstream risk-scoring engine (Axum HTTP + Tonic gRPC)"

[[bin]]
name = "wes-risk-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
